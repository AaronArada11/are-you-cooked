# Separate, disposable database; never mounts the development data volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: are_you_cooked_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d are_you_cooked_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@db:5432/are_you_cooked_test
    depends_on:
      db:
        condition: service_healthy
